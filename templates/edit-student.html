
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #e3f2fd;
            padding: 30px;
        }

        h2 {
            color: #253858;
            margin-bottom: 25px;
            text-align: center;
        }

        .form-container {
            width: 400px;
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin: auto;
        }

        label {
            display: block;
            color: #444;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #3730a3;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #4f46e5;
            text-decoration: none;
        }

        .home-link:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>
     <h2>Update Student {{std[1]}}</h2>
    <div class="form-container">

        <form action="/students/edit/{{std[0]}}" method="POST">

            <label>Name:</label>
            <input type="text" name="name" placeholder="Enter student name" required value="{{std[1]}}">

            <label>Age:</label>
            <input type="text" name="age" placeholder="Enter age" required value="{{std[2]}}">

            <label>Gender:</label>
            <input type="text" name="gender" placeholder="Enter gender" required value="{{std[3]}}">

            <label>Marks:</label>
            <input type="text" name="marks" placeholder="Enter marks" required value="{{std[4]}}">

            <label>Course:</label>
            <input type="text" name="course" placeholder="Enter course" required value="{{std[5]}}">

            <label>Image:</label>
            <input type="text" name="image" placeholder="Enter image URL" required value="{{std[6]}}">

            <label>Attendance:</label>
            <select name="status" required value="{{std[7]}}">
                <option value="1">Present</option>
                <option value="0">Absent</option>
            </select>

            <button type="submit">Update Student</button>

        </form>

        <a href="/" class="home-link">Back to Home</a>

    </div>

</body>
</html>
